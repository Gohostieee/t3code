  const states = [];
  const restore = globalThis.openai?.widgetState?.privateContent || {};
  function initialize(el,index) {
    const saved = restore[index] || {};
    const state={el,index,scene:scenes[saved.scene]?saved.scene:'app',selected:saved.selected||'web',edge:null,view:'map',mapped:new Set(saved.mapped||['app','frontend','chat']),labels:true,summaries:true};
    states.push(state);
    el.innerHTML=`<header class="cx-top"><div class="cx-brand">T3<span>Code</span></div><span class="cx-divider"></span><span class="cx-project-name">${icon('folder-git-2')} t3code</span><span class="cx-env">Local environment</span><div class="cx-top-spacer"></div>${index===0?`<div class="cx-toggle" aria-label="Workspace mode"><button data-action="chat" aria-pressed="false">${icon('messages-square')} Chat</button><button data-action="map" aria-pressed="true">${icon('network')} Codebase</button></div>`:`<span class="cx-depth">Project workspace</span>`}<span class="cx-prototype">UI CONCEPT</span></header><div class="cx-app"><aside class="cx-side"><div class="cx-side-label">PROJECT</div><button class="cx-nav" data-action="chat">${icon('messages-square')} Threads</button><button class="cx-nav" data-action="map" aria-current="page">${icon('network')} Codebase</button><div class="cx-tree"><div class="cx-side-label">EXPLORE</div><button class="cx-nav cx-sub" data-scene="app">${icon('box')} Whole app</button><button class="cx-nav cx-sub" data-scene="frontend">${icon('panels-top-left')} Web frontend</button><button class="cx-nav cx-sub" data-scene="server">${icon('server')} T3 server</button></div><div class="cx-side-footer">t3code<br>Local environment</div></aside><main class="cx-main"></main></div><div class="cx-sr" aria-live="polite"></div>`;

    el.addEventListener('dblclick',e=>{const card=e.target.closest('[data-node]');if(card)drill(state,card.dataset.node);});

    el.addEventListener('keydown',e=>{if(e.key==='Escape'){const overlay=el.querySelector('.cx-overlay,.cx-context');if(overlay){overlay.remove();el.querySelector('[data-action=passes]')?.focus();}else if(state.scene!=='app'){navigate(state,parent(state.scene));}}});
    render(state);

  function save(){if(!globalThis.openai?.setWidgetState)return;const privateContent={};states.forEach(s=>privateContent[s.index]={scene:s.scene,selected:s.selected,mapped:[...s.mapped]});Promise.resolve(globalThis.openai.setWidgetState({modelContent:{concepts:states.map(s=>({placement:s.index?'Project workspace':'Focus mode',scope:scenes[s.scene].scope}))},privateContent})).catch(()=>{});}
  function hydrate(){globalThis.lucide?.createIcons({attrs:{width:16,height:16}});}
  function parent(scene){return {frontend:'app',server:'app',chat:'frontend',functions:'chat'}[scene]||'app';}
  function navigate(s,id){if(!scenes[id])return;if(!s.mapped.has(id)){modal(s,`Explore ${scenes[id].scope}`,`<p>Build the next layer for this scope. Existing maps stay available.</p><div class="cx-pass-item"><span class="cx-pass-num">${scenes[id].depth}</span><div><strong>${scenes[id].eyebrow}</strong><p>Map responsibilities, dependencies, and source references.</p></div></div><div class="cx-notice">Preview state. This mockup uses sample results and does not run an agent.</div><button class="cx-btn cx-primary" style="margin-top:18px" data-generate="${id}">Build this layer ${icon('arrow-right')}</button>`);return;}s.scene=id;s.selected=scenes[id].selected;s.edge=null;s.view='map';render(s);save();}
  function render(s){
    const scene=scenes[s.scene];
    s.el.querySelectorAll('[data-action=chat]').forEach(b=>{b.setAttribute('aria-pressed',String(s.view==='chat'));b.removeAttribute('aria-current');});
    s.el.querySelectorAll('[data-action=map]').forEach(b=>{b.setAttribute('aria-pressed',String(s.view==='map'));if(s.view==='map')b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    const main=s.el.querySelector('.cx-main');
    if(s.view==='chat'){main.innerHTML=`<div class="cx-chat"><span class="cx-eyebrow">Back in your thread</span><h2>Exploring the codebase</h2><p>Your conversation stays here. The codebase map keeps its current location when you switch back.</p><div class="cx-chat-sample">I want to understand how the frontend talks to the backend.</div><button class="cx-btn cx-primary" data-action="map">${icon('network')} Return to codebase</button></div>`;hydrate();return;}
    const chain=[];let cur=s.scene;while(cur){chain.unshift(cur);cur=cur==='app'?null:parent(cur);}
    main.innerHTML=`<div class="cx-heading"><div><h1>Codebase</h1><p>${s.index?'A shared map of your project.':'Understand the app, one layer at a time.'}</p></div><button class="cx-btn" data-action="passes">${icon('layers')} Analysis passes</button></div><div class="cx-toolbar"><nav class="cx-crumbs" aria-label="Codebase location">${chain.map((id,i)=>`${i?'<span class="cx-sep">/</span>':''}<button data-scene="${id}">${esc(scenes[id].crumbs.at(-1))}</button>`).join('')}</nav><span class="cx-depth">Layer ${scene.depth} <span style="opacity:.5">/</span> ${scene.depth===1?'System':scene.depth===2?'Structure':scene.depth===3?'Behavior':'Functions'}</span></div><div class="cx-body"><div class="cx-map-area"><div class="cx-map-head"><span class="cx-eyebrow">${scene.eyebrow}</span><span class="cx-status">${icon('check')} ${s.mapped.has(s.scene)?'Mapped':'Overview ready'}</span></div><div class="cx-graph" aria-label="${scene.title}"></div><div class="cx-map-foot"><div class="cx-map-legend"><span><b></b> In code</span><span><b class="cx-inferred"></b> Inferred</span></div><span>Double-click to explore · Right-click for actions</span></div></div><aside class="cx-inspector" aria-label="Selected item details"></aside></div><footer class="cx-passbar">${icon('scan-line')}<div class="cx-pass-copy"><b>${s.scene==='app'?'App overview mapped':esc(scene.scope)+' mapped'}</b><p>${s.scene==='app'?'Deeper layers are built only when you explore them.':'Other scopes keep their existing maps.'}</p></div><span class="cx-pass-count">${s.mapped.size} scopes</span><button class="cx-btn" data-action="passes">View passes ${icon('arrow-up-right')}</button></footer>`;
    draw(s);inspect(s);hydrate();
    s.observer?.disconnect();s.observer=new ResizeObserver(()=>{if(s.view==='map')draw(s);});s.observer.observe(main.querySelector('.cx-graph'));
    s.el.querySelector('.cx-sr').textContent=`${scene.title}. Layer ${scene.depth}.`;
  }
  function draw(s){
    const graph=s.el.querySelector('.cx-graph');if(!graph)return;
    const scene=scenes[s.scene],width=graph.clientWidth;if(width===0)return;
    const narrow=width<430,nodeWidth=narrow?width:Math.min(190,(width-50)/3),gap=narrow?0:(width-nodeWidth*3)/2;
    const step=s.summaries?182:136;
    const positions=new Map();let height=step*2+168;
    if(narrow)height=scene.nodes.length*158+7;
    graph.style.height=`${height}px`;
    scene.nodes.forEach((n,i)=>positions.set(n.id,{x:narrow?0:n.col*(nodeWidth+gap),y:narrow?i*158+6:12+n.row*step,w:nodeWidth,h:s.summaries?139:101}));
    graph.innerHTML=`<svg class="cx-lines" aria-hidden="true" viewBox="0 0 ${width} ${height}"><defs><marker id="cx-arrow-${s.index}" markerWidth="6" markerHeight="6" refX="4.5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6" style="stroke:var(--cx-muted);fill:none;opacity:.7"></path></marker></defs></svg>`;
    const svg=graph.querySelector('svg');
    if(!narrow)scene.edges.forEach((edge,i)=>{const a=positions.get(edge[0]),b=positions.get(edge[1]);const x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2;const middle=(x1+x2)/2;let d=`M${x1},${y1} C${middle},${y1} ${middle},${y2} ${x2},${y2}`;
      if(a.x===b.x){d=`M${a.x+a.w},${y1} C${a.x+a.w+25},${y1} ${b.x+b.w+25},${y2} ${b.x+b.w},${y2}`;}
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.dataset.edgePath=String(i);path.setAttribute('d',d);path.setAttribute('marker-end',`url(#cx-arrow-${s.index})`);path.setAttribute('class',`${s.edge===i||edge[0]===s.selected||edge[1]===s.selected?'active':''} ${edge[4]==='inferred'?'inferred':''}`);svg.appendChild(path);
      if(s.labels&&gap>48&&a.x!==b.x){const label=document.createElement('button');label.className='cx-edge-label'+(s.edge===i?' selected':'');label.dataset.edge=String(i);label.style.left=middle+'px';label.style.top=(y1+y2)/2+'px';label.textContent=edge[2];label.setAttribute('aria-label',`${edge[2]}: ${edge[0]} to ${edge[1]}`);graph.appendChild(label);}
    });
    scene.nodes.forEach(n=>{const p=positions.get(n.id),card=document.createElement('article');card.className='cx-node'+(s.selected===n.id&&s.edge===null?' selected':'');card.dataset.node=n.id;card.style.cssText=`left:${p.x}px;top:${p.y}px;width:${p.w}px;`;card.innerHTML=`<button class="cx-node-main" data-select="${n.id}" aria-label="Inspect ${esc(n.name)}" aria-pressed="${s.selected===n.id&&s.edge===null}"><div class="cx-node-top">${icon(n.icon)}<span class="cx-node-name">${esc(n.name)}</span></div><div class="cx-node-type">${esc(n.type)}</div>${s.summaries?`<div class="cx-node-desc">${esc(n.desc)}</div>`:''}</button><div class="cx-node-bottom"><span class="cx-node-state">${n.state}</span>${n.child?`<button class="cx-node-open" data-open="${n.id}">Explore ${icon('chevron-right')}</button>`:`<span style="color:var(--cx-muted);font-size:10px">${s.scene==='functions'?'ƒ':'·'}</span>`}</div>`;graph.appendChild(card);});
    hydrate();
  }
  function inspect(s){const scene=scenes[s.scene],panel=s.el.querySelector('.cx-inspector');if(!panel)return;
    if(s.edge!==null){const edge=scene.edges[s.edge],from=scene.nodes.find(n=>n.id===edge[0]),to=scene.nodes.find(n=>n.id===edge[1]);panel.innerHTML=`<span class="cx-eyebrow">Connection</span><div class="cx-inspector-title"><span class="cx-inspector-icon">${icon('arrow-right-left')}</span><h2>${edge[2]}</h2></div><p class="cx-summary">${edge[3]}</p><div class="cx-detail-section"><h3>Direction</h3><button class="cx-source" data-select="${from.id}">${from.name}</button><span style="color:var(--cx-muted)">↓</span><button class="cx-source" data-select="${to.id}">${to.name}</button></div><div class="cx-detail-section"><h3>Evidence</h3><p class="cx-summary">${edge[4]==='inferred'?'Inferred relationship. Review the source before treating this as a direct dependency.':'Representative relationship based on the project structure. Source evidence would appear here in the finished feature.'}</p><span class="cx-tag">Illustrative map · Not a completed code analysis</span></div>`;hydrate();return;}
    const n=scene.nodes.find(n=>n.id===s.selected)||scene.nodes[0];s.selected=n.id;
    const connections=scene.edges.map((e,i)=>({e,i})).filter(({e})=>e[0]===n.id||e[1]===n.id);
    panel.innerHTML=`<span class="cx-eyebrow">${s.scene==='functions'?'Function details':'Selected '+(s.scene==='app'?'system':'component')}</span><div class="cx-inspector-title"><span class="cx-inspector-icon">${icon(n.icon)}</span><div><h2>${esc(n.name)}</h2><span class="cx-tag">${esc(n.type)}</span></div></div><p class="cx-summary">${esc(n.summary||n.desc)}</p>${n.stack?`<div class="cx-stack">${n.stack.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}${n.contains?`<div class="cx-detail-section"><h3>${s.scene==='functions'?'Inputs & effects':'What’s inside'}</h3>${n.contains.map(x=>`<div class="cx-detail-row">${icon('corner-down-right')}<span>${esc(x)}</span></div>`).join('')}</div>`:''}<div class="cx-detail-section"><h3>Connections</h3>${connections.map(({e,i})=>`<button class="cx-source" data-edge="${i}" style="font-family:inherit!important">${esc(e[2])} ${e[0]===n.id?'→':'←'} ${esc(scene.nodes.find(x=>x.id===(e[0]===n.id?e[1]:e[0])).name)}</button>`).join('')}</div>${n.sources?`<div class="cx-detail-section"><h3>Source references</h3>${n.sources.map(x=>`<button class="cx-source" data-source="${esc(x)}">${esc(x)} ↗</button>`).join('')}</div>`:''}${n.child?`<button class="cx-btn cx-primary" data-open="${n.id}">${icon('scan')} Explore ${esc(n.name)} ${icon('arrow-right')}</button>`:`<span class="cx-tag">${n.state==='Overview only'?'Deeper analysis has not run for this scope.':'Illustrative map · UI concept'}</span>`}`;hydrate();
  }
  function select(s,id){s.selected=id;s.edge=null;s.el.querySelectorAll('[data-node]').forEach(el=>{const active=el.dataset.node===id;el.classList.toggle('selected',active);el.querySelector('[data-select]')?.setAttribute('aria-pressed',String(active));});s.el.querySelectorAll('[data-edge-path]').forEach(el=>{const edge=scenes[s.scene].edges[Number(el.dataset.edgePath)];el.classList.toggle('active',edge[0]===id||edge[1]===id);});s.el.querySelectorAll('.cx-edge-label').forEach(el=>el.classList.remove('selected'));inspect(s);save();}
  function drill(s,id){const n=scenes[s.scene].nodes.find(n=>n.id===id);if(!n?.child){select(s,id);return;}if(s.mapped.has(n.child)){navigate(s,n.child);return;}modal(s,`Explore ${n.name}`,`<p>Build the next layer for <strong>${n.name}</strong>. The rest of the map stays as it is.</p><div class="cx-pass-item"><span class="cx-pass-num">${scenes[n.child].depth}</span><div><strong>${scenes[n.child].eyebrow}</strong><p>Summarize each item, connect its dependencies, and attach source references.</p></div></div><div class="cx-notice">Preview state. This mockup uses sample results and does not run an agent.</div><button class="cx-btn cx-primary" style="margin-top:18px" data-generate="${n.child}">Build this layer ${icon('arrow-right')}</button>`);}
  function modal(s,title,body){s.el.querySelector('.cx-overlay')?.remove();const overlay=document.createElement('div');overlay.className='cx-overlay';overlay.innerHTML=`<section class="cx-modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="cx-modal-head"><h2>${esc(title)}</h2><button data-action="close" aria-label="Close dialog">${icon('x')}</button></div>${body}</section>`;s.el.appendChild(overlay);hydrate();overlay.querySelector('button')?.focus();}
  function passes(s){modal(s,'Build understanding in passes',`<p>Map the app first. Expand a selected scope when you need more detail.</p>${[['1','System overview','Clients, server, providers, storage.','Ready'],['2','Routes & modules','Entry points and major building blocks.','Web frontend ready'],['3','Components & behavior','Responsibilities and local dependencies.','ChatView ready'],['4','Functions & side effects','Inputs, outputs, callers, and effects.',s.mapped.has('functions')?'useThreadActions ready':'Not yet built']].map(([num,title,desc,status])=>`<div class="cx-pass-item"><span class="cx-pass-num">${num}</span><div><strong>${title}</strong><p>${desc}</p><p style="color:var(--cx-blue)">${status}</p></div></div>`).join('')}<div class="cx-notice">Sample coverage for this concept. Unexplored scopes remain visible as “Overview only”.</div>`);}
  function context(s,event){s.el.querySelector('.cx-context')?.remove();const bounds=s.el.getBoundingClientRect(),menu=document.createElement('div');menu.className='cx-context';menu.style.left=Math.min(Math.max(8,event.clientX-bounds.left),bounds.width-205)+'px';menu.style.top=Math.min(event.clientY-bounds.top,bounds.height-130)+'px';const n=scenes[s.scene].nodes.find(n=>n.id===s.selected);menu.innerHTML=`${n?.child?`<button data-open="${s.selected}">${icon('scan')} Explore next layer</button>`:''}<button data-action="inspect">${icon('info')} Inspect details</button><button data-action="connections">${icon('arrow-right-left')} Show connections</button>`;s.el.appendChild(menu);hydrate();menu.querySelector('button').focus();}
  function click(s,event){const b=event.target.closest('button');if(!b)return;s.el.querySelector('.cx-context')?.remove();if(b.dataset.scene){navigate(s,b.dataset.scene);return;}if(b.dataset.select){select(s,b.dataset.select);return;}if(b.dataset.open){drill(s,b.dataset.open);return;}if(b.dataset.edge!==undefined){s.edge=Number(b.dataset.edge);draw(s);inspect(s);return;}if(b.dataset.generate){s.mapped.add(b.dataset.generate);s.el.querySelector('.cx-overlay')?.remove();navigate(s,b.dataset.generate);return;}if(b.dataset.source){modal(s,'Source reference',`<p>${esc(b.dataset.source)}</p><pre>${s.scene==='functions'?'archiveThread(target, options)\n  → resolve the environment and thread\n  → dispatch the archive mutation\n  → coordinate the next selected thread':'Selected scope\n  '+esc(scenes[s.scene].scope)+'\n\nReference\n  '+esc(b.dataset.source)}</pre><div class="cx-notice">Reference preview. In the feature, this opens the file at its source location.</div>`);return;}
    const action=b.dataset.action;if(action==='passes')passes(s);if(action==='close'){s.el.querySelector('.cx-overlay')?.remove();s.el.querySelector('[data-action=passes]')?.focus();}if(action==='chat'||action==='map'){s.view=action;render(s);}if(action==='inspect')inspect(s);if(action==='connections'){const i=scenes[s.scene].edges.findIndex(e=>e[0]===s.selected||e[1]===s.selected);if(i>=0){s.edge=i;draw(s);inspect(s);}}
  }
  root.querySelectorAll('.cx-product').forEach(initialize);
  window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent;if(!next)return;states.forEach((s,i)=>{if(scenes[next[i]?.scene]){s.scene=next[i].scene;s.selected=next[i].selected;s.mapped=new Set(next[i].mapped||['app']);render(s);}});});
})();
</script>

<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) => {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest("[data-tooltip]");
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) => {
    lastPointerWasTouch =
      event.type === "pointerdown" && event.pointerType === "touch";
  };
  const handleTouchClick = (event) => {
    const isTouch = event.pointerType === "touch" || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch && activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() => {
      if (activeTrigger === trigger && !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) => {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) => {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) => {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll("*")) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) => {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) => {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host && !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger && !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () => {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>
<script id="codex-visualization-carousel">
  (() => {
    for (const root of document.querySelectorAll(".viz-carousel")) {
      const panels = Array.from(
        root.querySelectorAll(":scope > [data-variant]"),
      );
      if (panels.length === 0) {
        continue;
      }
      root.setAttribute("role", "group");
      panels.forEach((panel, index) => {
        panel.hidden = index !== 0;
        panel.setAttribute("role", "group");
        if (!panel.hasAttribute("aria-label")) {
          panel.setAttribute("aria-label", panel.dataset.variant);
        }
      });
      root.dataset.activeVariant = panels[0].dataset.variant;
      if (panels.length === 1) {
        continue;
      }

      const controls = document.createElement("div");
      controls.className = "viz-carousel-controls";
      // Portable copy of the settings dropdown's legacy glyph; no 14px icon-package preset matches it.
      // https://github.com/openai/openai/blob/master/codex/codex-apps/webview/src/icons/chevron.svg
      controls.innerHTML = `
      <button type="button" class="viz-carousel-previous cursor-interaction"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <details class="viz-carousel-picker">
        <summary class="cursor-interaction">
          <span class="viz-carousel-count tabular-nums"></span>
          <span class="viz-carousel-name"></span>
          <svg class="viz-carousel-caret" width="14" height="14" viewBox="0 0 20 21" fill="none" aria-hidden="true" focusable="false">
            <path d="M15.2793 7.71101C15.539 7.45131 15.961 7.45131 16.2207 7.71101C16.4804 7.97071 16.4804 8.39272 16.2207 8.65242L10.4707 14.4024C10.211 14.6621 9.78902 14.6621 9.52932 14.4024L3.77932 8.65242L3.69436 8.54792C3.52385 8.28979 3.55205 7.93828 3.77932 7.71101C4.00659 7.48374 4.3581 7.45554 4.61623 7.62605L4.72073 7.71101L10 12.9903L15.2793 7.71101Z" fill="currentColor" stroke="currentColor" stroke-width="0.6" />
          </svg>
        </summary>
        <div class="viz-carousel-options"></div>
      </details>
      <button type="button" class="viz-carousel-next cursor-interaction"><i data-lucide="chevron-right" aria-hidden="true"></i></button>`;
      const previous = controls.querySelector(".viz-carousel-previous");
      const next = controls.querySelector(".viz-carousel-next");
      const picker = controls.querySelector(".viz-carousel-picker");
      const summary = picker.querySelector("summary");
      const count = controls.querySelector(".viz-carousel-count");
      const name = controls.querySelector(".viz-carousel-name");
      const options = controls.querySelector(".viz-carousel-options");
      const status = document.createElement("span");
      status.className = "sr-only";
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");
      status.setAttribute("aria-atomic", "true");
      previous.setAttribute(
        "aria-label",
        root.dataset.previousLabel ?? "Previous variant",
      );
      next.setAttribute("aria-label", root.dataset.nextLabel ?? "Next variant");

      let active = 0;
      let mousePointerId = null;
      let summaryPointerHandled = false;
      summary.addEventListener("pointerdown", (event) => {
        summaryPointerHandled =
          event.pointerType === "mouse" && event.button === 0 && !event.ctrlKey;
        if (!summaryPointerHandled) {
          return;
        }
        event.preventDefault();
        summary.focus({ preventScroll: true });
        picker.open = !picker.open;
        mousePointerId = picker.open ? event.pointerId : null;
      });
      summary.addEventListener("click", (event) => {
        if (summaryPointerHandled && event.detail > 0) {
          event.preventDefault();
        }
      });
      const choices = panels.map((panel, index) => {
        const choice = document.createElement("button");
        choice.type = "button";
        choice.className = "cursor-interaction";
        choice.textContent = panel.dataset.variant;
        choice.addEventListener("click", () => {
          select(index);
          summary.focus();
        });
        choice.addEventListener("pointerup", (event) => {
          if (
            picker.open &&
            event.pointerType === "mouse" &&
            event.button === 0 &&
            event.pointerId === mousePointerId
          ) {
            choice.click();
          }
        });
        options.appendChild(choice);
        return choice;
      });
      const select = (index) => {
        const changed = active !== index;
        active = index;
        panels.forEach((panel, position) => {
          panel.hidden = position !== active;
          choices[position].setAttribute(
            "aria-current",
            String(position === active),
          );
        });
        root.dataset.activeVariant = panels[active].dataset.variant;
        count.textContent = `${active + 1} / ${panels.length}`;
        name.textContent = panels[active].dataset.variant;
        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener("click", () =>
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener("click", () =>
        select((active + 1) % panels.length),
      );
      picker.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && picker.open) {
          event.preventDefault();
          picker.open = false;
          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === "ArrowDown") {
          nextIndex = index < 0 ? active : (index + 1) % choices.length;
        } else if (event.key === "ArrowUp") {
          nextIndex = index < 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open && event.key === "Home") {
          nextIndex = 0;
        } else if (picker.open && event.key === "End") {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener("focusout", (event) => {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) => {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () => {
        mousePointerId = null;
      };
      const sizePicker = () => {
        root.style.setProperty(
          "--viz-carousel-picker-height",
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener("toggle", sizePicker);
      window.addEventListener("resize", sizePicker);
      document.addEventListener("pointerdown", dismiss);
      document.addEventListener("pointerup", endPointerSelection);
      document.addEventListener("pointercancel", endPointerSelection);
      window.addEventListener("blur", endPointerSelection);
      window.addEventListener(
        "pagehide",
        () => {
          document.removeEventListener("pointerdown", dismiss);
          document.removeEventListener("pointerup", endPointerSelection);
          document.removeEventListener("pointercancel", endPointerSelection);
          window.removeEventListener("blur", endPointerSelection);
          window.removeEventListener("resize", sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
</script>
<script id="codex-visualization-lucide" async src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
<script>
(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>
