name: T4 Code nightly

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t4code-nightly
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows x64
    if: github.repository == 'Gohostieee/t3code'
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: vp install --frozen-lockfile -- --side-effects-cache=false

      - name: Ensure Electron runtime
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Resolve nightly version
        id: version
        run: |
          $baseVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $stamp = (Get-Date).ToUniversalTime()
          $revision = [int][Math]::Floor($stamp.TimeOfDay.TotalSeconds)
          "version=$baseVersion-nightly.$($stamp.ToString('yyyyMMdd')).$revision" >> $env:GITHUB_OUTPUT

      - name: Build installer
        env:
          T4_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-t4-nightly.ps1 -Version $env:T4_BUILD_VERSION

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t4code-windows-x64-${{ steps.version.outputs.version }}
          path: |
            release/t4code/*.exe
            release/t4code/*.blockmap
            release/t4code/nightly.yml
            release/t4code/SOURCE.txt
            release/t4code/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          T4_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:T4_BUILD_VERSION"
          $installerName = "T4-Code-$env:T4_BUILD_VERSION-x64.exe"
          $assets = @($installerName, "$installerName.blockmap", "nightly.yml", "SOURCE.txt", "SHA256SUMS.txt") |
            ForEach-Object { "release/t4code/$_" }
          @(
            "Windows x64 nightly build of T4 Code.",
            "",
            "Download and run ``$installerName``. This unsigned nightly uses its own app identity and data directory, and checks this repository for nightly updates.",
            "",
            "Source: https://github.com/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA",
            "Build: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "",
            "``SHA256SUMS.txt`` contains the checksums; ``SOURCE.txt`` identifies the exact source."
          ) | Set-Content "$env:RUNNER_TEMP/t4-release-notes.md"
          gh release create $tag @assets --target $env:GITHUB_SHA --title "T4 Code Nightly $env:T4_BUILD_VERSION" --notes-file "$env:RUNNER_TEMP/t4-release-notes.md" --prerelease --draft --latest=false
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload the nightly release." }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish the nightly release." }
